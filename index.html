 p{margin:7px 0;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 10px;border-radius:999px;background:#eef5f0;color:var(--green);font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:18px 0}.section-title h2{margin:0;font-size:32px}.section-title p{margin:0;color:var(--muted)}.districts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.district{padding:20px;min-height:190px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#2f7661,#163e34);text-align:left}.district:nth-child(2){background:linear-gradient(145deg,#c65d55,#713231)}.district:nth-child(3){background:linear-gradient(145deg,#bf8c36,#60471f)}.district:nth-child(4){background:linear-gradient(145deg,#495f9c,#252d59)}.district:nth-child(5){background:linear-gradient(145deg,#765b9b,#3b2d55)}.district h3{font-size:24px;margin:0 0 10px}.district p{color:#ffffffd9;margin:0}.detail{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.list{margin:0;padding-left:19px}.list li{margin:7px 0}.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#fff1df;color:#815d22;font-size:12px;font-weight:700}.back{background:none;color:var(--red);padding:8px 0;font-weight:700}.timeline{border-left:3px solid #dce9df;padding-left:20px}.timeline article{position:relative;margin:0 0 20px}.timeline article:before{content:"";position:absolute;left:-28px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--red)}.timeline h3{margin:0}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}.phrase{padding:15px 0;border-bottom:1px solid var(--line)}.phrase strong{display:block}.jp{color:var(--red);font-size:20px}.notice{padding:18px;border-radius:16px;background:#fff3cd;border:1px solid #f1d995}.muted{color:var(--muted)}@media(max-width:900px){.app{display:block}.side{position:relative;height:auto;padding:18px}.side-note{display:none}nav{display:flex;ove
