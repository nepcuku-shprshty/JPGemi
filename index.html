<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Family Guide 2026</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 12px;
    }
  </style>
</head>
<body class="h-full flex flex-col max-w-md mx-auto bg-slate-950 font-sans relative pb-24 border-x border-slate-800/60 min-h-screen">

  <header class="sticky top-0 z-50 glass-card px-5 py-4 border-b border-slate-800/80 flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30 text-xs">
        JP
      </div>
      <div>
        <h1 class="font-extrabold text-sm tracking-tight text-white leading-none">Tokyo Family Guide</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">25 Окт — 05 Ноя 2026 • Сумида</p>
      </div>
    </div>
    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      Oshiage
    </span>
  </header>

  <main id="app-content" class="flex-1 p-4 space-y-4"></main>

  <!-- Navigation Bar (4 кнопки) -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-slate-800/80 flex justify-around py-2 px-1 z-50">
    <button onclick="switchTab('itinerary')" id="tab-itinerary" class="nav-btn active flex flex-col items-center py-1.5 px-2 text-slate-400 transition-all">
      <span class="text-base">📅</span>
      <span class="text-[9px] font-semibold mt-0.5">Маршрут</span>
    </button>
    <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-btn flex flex-col items-center py-1.5 px-2 text-slate-400 transition-all">
      <span class="text-base">🛍️</span>
      <span class="text-[9px] font-semibold mt-0.5">Шопинг</span>
    </button>
    <button onclick="switchTab('insider')" id="tab-insider" class="nav-btn flex flex-col items-center py-1.5 px-2 text-slate-400 transition-all">
      <span class="text-base">📖</span>
      <span class="text-[9px] font-semibold mt-0.5">База знаний</span>
    </button>
    <button onclick="switchTab('phrases')" id="tab-phrases" class="nav-btn flex flex-col items-center py-1.5 px-3 text-slate-400 transition-all">
      <span class="text-base">🗣️</span>
      <span class="text-[9px] font-semibold mt-0.5">Разговорник</span>
    </button>
  </nav>

  <script>
    const TRIP_DATA = {
      dailyItinerary: [
        {
          day: "День 1", date: "25 Октября", badge: "Перелет", title: "Вылет и транзит в Сеуле",
          steps: [
            { time: "00:05", text: "Вылет из Алматы (KC 909, Т2). Время в пути 5ч 50мин." },
            { time: "09:55", text: "Прилет в Сеул (ICN, Т1). Прохождение границы (K-ETA)." },
            { time: "11:30", text: "Выезд в город на автобусе 6001 до ул. Мёндон или отдых в Nap Zone (4 этаж)." },
            { time: "21:30", text: "Вылет из Сеула в Токио (OZ 178). Вылет из Терминала 2!" },
            { time: "23:25", text: "Приземление в Токио (Ханеда, Т3). Сканирование Visit Japan Web." }
          ]
        },
        {
          day: "День 2", date: "26 Октября", badge: "Адаптация", title: "Ошиаге и Асакуса",
          steps: [
            { time: "09:00", text: "Завтрак из FamilyMart (свежее молоко, Shokupan)." },
            { time: "10:30", text: "Прогулка вокруг Skytree и ТЦ Solamachi. Покупка продуктов в LIFE." },
            { time: "15:00", text: "Храм Сэнсо-дзи и сувенирная улица Накамисэ-дори." }
          ]
        },
        {
          day: "День 3", date: "27 Октября", badge: "Дисней", title: "Tokyo Disneyland (Сказочный день)",
          steps: [
            { time: "07:30", text: "Выезд из Ошиаге на станции Maihama (Tokyo Disneyland)." },
            { time: "08:30", text: "Прибытие к парку. Аренда детской коляски на входе." },
            { time: "09:00", text: "Зона Fantasyland: Замок Золошки, сказочные аттракционы для детей." },
            { time: "13:00", text: "Дневной парад Дисней персонажей (лучше занять место за 20 мин)." },
            { time: "16:00", text: "Toontown: Домики Микки Мауса и безопасные детские площадки." },
            { time: "19:30", text: "Вечерний световой парад и салют над замком." }
          ]
        },
        {
          day: "День 4", date: "28 Октября", badge: "Прогулка", title: "Акихабара и Парк Уэно",
          steps: [
            { time: "10:00", text: "Парк Уэно, прогулка у пруда Синобадзу с коляской." },
            { time: "14:00", text: "Акихабара: ТЦ Yodobashi Camera (огромный отдел игрушек на 6 этаже)." }
          ]
        },
        {
          day: "День 12", date: "05 Ноября", badge: "Возвращение", title: "Вылет домой через Сеул",
          steps: [
            { time: "04:10", text: "Прилет в Сеул (ICN, Т2). Отдых в Nap Zone (4 этаж Т2)." },
            { time: "13:00", text: "Вылет обратно в Алматы." }
          ]
        }
      ],
      shoppingSpots: [
        {
          category: "Традиционные рынки",
          items: [
            { name: "Рынок Амэёко (Ameyoko)", location: "Уэно", desc: "Шумный уличный рынок под ж/д путями. Свежие фрукты, морепродукты, сувениры, доступная одежда и уличная еда." },
            { name: "Внешний рынок Цукидзи (Tsukiji)", location: "Цукидзи", desc: "Главный гастрономический рынок. Вагю на гриле, свежие морепродукты, гигантские клубничные десерты и ножи." }
          ]
        },
        {
          category: "Торговые центры и Моллы",
          items: [
            { name: "Tokyo Solamachi", location: "Ошиаге (у дома)", desc: "Более 300 магазинов прямо под Skytree. Официальные магазины Pokemon Center, Ghibli (Donguri), супермаркет LIFE." },
            { name: "Yodobashi Camera Akiba", location: "Акихабара", desc: "9 этажей электроники, техники, детских игрушек, моделей и фигурок. Налог Tax-Free оформляют на месте." },
            { name: "Shibuya Parco", location: "Сибуя", desc: "Флагманский магазин Nintendo Tokyo, Pokemon Center, Capcom Store и современные японские бренды одежды." }
          ]
        },
        {
          category: "Сети и Гипермаркеты",
          items: [
            { name: "MEGA Don Quijote", location: "Сибуя / Асакуса", desc: "Огромный круглосуточный дискаунтер. Японские сладости, косметика, сувениры, бытовая химия по самым низким ценам." },
            { name: "Bic Camera / Uniqlo", location: "Гинза / Синдзюку", desc: "Многоэтажные флагманские магазины одежды Uniqlo и GU, а также электроника с Tax-Free." }
          ]
        }
      ],
      insiderGuides: [
        { title: "Жизнь в Ошиаге (Sumida)", content: "Супермаркет LIFE в ТЦ Solamachi открыт с 10:00 до 21:00. Скидки на готовую еду (скидки до 50%) появляются после 19:00. Выход B3 со станции Oshiage оснащен лифтами прямо к улице." },
        { title: "Особенности Tokyo Disneyland", content: "Покупайте билеты заранее через официальное приложение или Klook. Внутри парка доступна аренда удобных детских колясок (1000 иен/день). Пользуйтесь услугой Rider Switch, если ребенок не проходит по росту на некоторые аттракционы." },
        { title: "Транзит в Сеуле (ICN)", content: "Туда: прилет в Т1, вылет из Т2. Обратно: прилет в Т2 в 04:10 утра, идите в Nap Zone на 4 этаже Т2 (бесплатный отдых)." }
      ],
      phrases: [
        { ru: "Можно оформить Tax-Free?", jp: "免税できますか？", romaji: "Menzei dekimasu ka?", tag: "Шопинг" },
        { ru: "Где находится лифт?", jp: "エレベーターはどこですか？", romaji: "Erebētā wa doko desu ka?", tag: "Коляска" },
        { ru: "Есть комната матери и ребенка?", jp: "赤ちゃんルームはありますか？", romaji: "Aka-chan rūmu wa arimasu ka?", tag: "Малыш" },
        { ru: "Разогрейте это, пожалуйста", jp: "温めてください", romaji: "Atatamete kudasai", tag: "Магазин" }
      ]
    };

    function switchTab(tabName) {
      const container = document.getElementById("app-content");
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-indigo-400');
        btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if(activeBtn) {
        activeBtn.classList.add('active', 'text-indigo-400');
        activeBtn.classList.remove('text-slate-400');
      }

      if (tabName === 'itinerary') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Подневный план</h2>` +
          TRIP_DATA.dailyItinerary.map(d => `
            <div class="glass-card p-4 rounded-2xl space-y-2 mb-3">
              <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">${d.day} • ${d.date} (${d.badge})</div>
              <div class="text-sm font-bold text-white">${d.title}</div>
              <div class="border-t border-slate-800 pt-2 space-y-2">
                ${d.steps.map(s => `
                  <div class="flex gap-2.5 text-xs text-slate-300 items-start">
                    <span class="bg-slate-900 text-indigo-400 px-1.5 py-0.5 rounded font-mono text-[10px] border border-slate-800 shrink-0">${s.time}</span>
                    <span>${s.text}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
      } else if (tabName === 'shopping') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Гид по шопингу и рынкам</h2>` +
          TRIP_DATA.shoppingSpots.map(sec => `
            <div class="mb-4">
              <h3 class="text-xs font-bold text-slate-400 uppercase mb-2 pl-1">${sec.category}</h3>
              ${sec.items.map(item => `
                <div class="glass-card p-3.5 rounded-2xl mb-2.5 space-y-1">
                  <div class="flex justify-between items-start">
                    <div class="text-sm font-bold text-white">${item.name}</div>
                    <span class="text-[9px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">${item.location}</span>
                  </div>
                  <div class="text-xs text-slate-300 leading-relaxed">${item.desc}</div>
                </div>
              `).join('')}
            </div>
          `).join('');
      } else if (tabName === 'insider') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Japan Insider</h2>` +
          TRIP_DATA.insiderGuides.map(g => `
            <div class="glass-card p-4 rounded-2xl space-y-1.5 mb-3">
              <div class="text-sm font-bold text-white">${g.title}</div>
              <div class="text-xs text-slate-300 leading-relaxed">${g.content}</div>
            </div>
          `).join('');
      } else if (tabName === 'phrases') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Разговорник</h2>` +
          TRIP_DATA.phrases.map(p => `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center gap-3 mb-3">
              <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">${p.tag} • ${p.ru}</div>
                <div class="text-base font-bold text-white my-0.5">${p.jp}</div>
                <div class="text-xs text-indigo-400">${p.romaji}</div>
              </div>
              <button onclick="speakJP('${p.jp}')" class="bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 w-10 h-10 rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition-transform">
                🔊
              </button>
            </div>
          `).join('');
      }
    }

    function speakJP(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        window.speechSynthesis.speak(u);
      }
    }

    window.onload = function() {
      switchTab('itinerary');
    };
  </script>
</body>
</html>
