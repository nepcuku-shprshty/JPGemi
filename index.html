<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Family Guide 2026</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 12px;
    }
  </style>
</head>
<body class="h-full flex flex-col max-w-md mx-auto bg-slate-950 font-sans relative pb-24 border-x border-slate-800/60 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-card px-5 py-4 border-b border-slate-800/80 flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30 text-xs">
        JP
      </div>
      <div>
        <h1 class="font-extrabold text-sm tracking-tight text-white leading-none">Tokyo Family Guide</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">25 Окт — 05 Ноя 2026 • Сумида</p>
      </div>
    </div>
    <button onclick="toggleCalc()" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-1 active:scale-95 transition-transform">
      🧮 JPY Калькулятор
    </button>
  </header>

  <!-- Всплывающий Калькулятор Иен -->
  <div id="calc-modal" class="hidden p-4 bg-slate-900 border-b border-slate-800 space-y-2">
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold text-indigo-400 uppercase">Быстрый конвертер (JPY)</span>
      <button onclick="toggleCalc()" class="text-xs text-slate-400">✕ Закрыть</button>
    </div>
    <div class="flex gap-2">
      <input id="jpy-input" type="number" placeholder="Сумма в Иенах (¥)" oninput="convertCurrency()" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
      <div class="w-1/2 text-xs space-y-0.5 bg-slate-950/60 p-2 rounded-xl border border-slate-800/80">
        <div id="res-kzt" class="font-bold text-emerald-400">0 KZT</div>
        <div id="res-usd" class="text-slate-400">0 USD</div>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main id="app-content" class="flex-1 p-4 space-y-4"></main>

  <!-- Navigation Bar (5 вкладок) -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-slate-800/80 flex justify-around py-2 px-1 z-50">
    <button onclick="switchTab('itinerary')" id="tab-itinerary" class="nav-btn active flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
      <span class="text-base">📅</span>
      <span class="text-[8px] font-semibold mt-0.5">Маршрут</span>
    </button>
    <button onclick="switchTab('districts')" id="tab-districts" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
      <span class="text-base">🏙️</span>
      <span class="text-[8px] font-semibold mt-0.5">Районы</span>
    </button>
    <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
      <span class="text-base">🛍️</span>
      <span class="text-[8px] font-semibold mt-0.5">Шопинг</span>
    </button>
    <button onclick="switchTab('insider')" id="tab-insider" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
      <span class="text-base">📖</span>
      <span class="text-[8px] font-semibold mt-0.5">Инсайдер</span>
    </button>
    <button onclick="switchTab('phrases')" id="tab-phrases" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
      <span class="text-base">🗣️</span>
      <span class="text-[8px] font-semibold mt-0.5">Разговорник</span>
    </button>
  </nav>

  <script>
    const TRIP_DATA = {
      dailyItinerary: [
        {
          day: "День 1", date: "25 Октября", badge: "Перелет", title: "Вылет и транзит в Сеуле",
          steps: [
            { time: "00:05", text: "Вылет из Алматы (KC 909, Т2). В пути 5ч 50мин." },
            { time: "09:55", text: "Прилет в Сеул (ICN, Т1). Прохождение K-ETA.", query: "Incheon International Airport" },
            { time: "11:30", text: "Выезд в город на автобусе 6001 до Мёндон или Nap Zone (Т1, 4 этаж)." },
            { time: "21:30", text: "Вылет из Сеула в Токио (OZ 178). Вылет из Т2!" },
            { time: "23:25", text: "Приземление в Токио (Ханеда, Т3). Visit Japan Web.", query: "Haneda Airport Terminal 3" }
          ]
        },
        {
          day: "День 2", date: "26 Октября", badge: "Адаптация", title: "Ошиаге и Асакуса",
          steps: [
            { time: "09:00", text: "Завтрак из FamilyMart (свежее молоко, Shokupan)." },
            { time: "10:30", text: "Прогулка у Skytree и ТЦ Solamachi. Супермаркет LIFE.", query: "Tokyo Skytree Solamachi" },
            { time: "15:00", text: "Храм Сэнсо-дзи и улица Накамисэ-дори.", query: "Sensō-ji Temple Tokyo" }
          ]
        },
        {
          day: "День 3", date: "27 Октября", badge: "Дисней", title: "Tokyo Disneyland (Сказочный день)",
          steps: [
            { time: "07:30", text: "Выезд до станции Maihama (Tokyo Disneyland).", query: "Tokyo Disneyland" },
            { time: "08:30", text: "Аренда детской коляски на входе (1000 иен)." },
            { time: "09:00", text: "Зона Fantasyland: Замок Золушки и детские аттракционы." },
            { time: "13:00", text: "Дневной сказочный парад персонажей." },
            { time: "16:00", text: "Toontown: Домики Микки Мауса и мягкие площадки." },
            { time: "19:30", text: "Вечернее световое шоу и фейерверк." }
          ]
        },
        {
          day: "День 4", date: "28 Октября", badge: "Прогулка", title: "Акихабара и Парк Уэно",
          steps: [
            { time: "10:00", text: "Парк Уэно, прогулка у пруда Синобадзу.", query: "Ueno Park" },
            { time: "14:00", text: "Акихабара: Yodobashi Camera (6 этаж — игрушки).", query: "Yodobashi Camera Akiba" }
          ]
        },
        {
          day: "День 12", date: "05 Ноября", badge: "Возвращение", title: "Вылет домой через Сеул",
          steps: [
            { time: "04:10", text: "Прилет в Сеул (ICN, Т2). Бесплатная Nap Zone (4 этаж)." },
            { time: "13:00", text: "Вылет обратно в Алматы." }
          ]
        }
      ],
      districts: [
        {
          name: "Сумида (Sumida / Oshiage)",
          tag: "Базовый район поездки",
          history: "Историческая ремесленная окраина (Заречье) старого Эдо. В 2012 году здесь возвели башню Tokyo Skytree, превратив район в современный семейный центр.",
          atmosphere: "Спокойный, спальный, предельно безопасный и семейный район с духом старого Токио (shitamachi). Отсутствие шумных ночных клубов.",
          residents: "Молодые японские семьи с детьми, пожилые коренные жители Эдо.",
          architecture: "Контраст: ультрасовременная башня Skytree рядом с узкими тихими улочками и 2-3 этажными частными домами.",
          realEstate: "Покупка: ~$7,000–$9,000 / м². Аренда 1К: ~$750–$950 / мес. Относительно доступно для Токио.",
          spots: ["Tokyo Skytree & ТЦ Solamachi", "Музей Сумо (Ryogoku Kokugikan)", "Парк Сумида вдоль реки"]
        },
        {
          name: "Сибуя (Shibuya)",
          tag: "Центр молодежи и трендов",
          history: "В эпоху Эдо — феодальная усадьба, затем ж/д узловая станция. В 1970-х стала центром молодежной моды и поп-культуры.",
          atmosphere: "Неоновый гигант, непрерывный поток людей, музыка, мода, стартапы и энергия.",
          residents: "Студенты, молодые IT-предприниматели, экспаты, дизайнеры.",
          architecture: "Футуристические небоскребы (Shibuya Scramble Square) и хаотичные переулки с неоновыми вывесками.",
          realEstate: "Покупка: ~$14,000–$20,000 / м². Аренда 1К: ~$1,400–$2,000 / мес. Один из самых дорогих районов.",
          spots: ["Перекресток Shibuya Crossing", "Статуя Хатико", "Парк Йойоги & Храм Мэйдзи"]
        },
        {
          name: "Гинза (Ginza)",
          tag: "Роскошь и Высокая мода",
          history: "В XVII веке здесь чеканили серебряные монеты (название означает «серебряный двор»). В XIX веке стала первым европейским кварталом Токио.",
          atmosphere: "Аристократизм, безупречная чистота, тихий люкс, дорогие рестораны и галереи.",
          residents: "Зажиточные бизнесмены, дипломаты, ценители искусства.",
          architecture: "Западный стиль XIX века, монументальные гранитные фасады, флагманские бутики с премиальной стеклянной архитектурой.",
          realEstate: "Покупка: от $25,000+ / м². Аренда: от $2,200+ / мес. Элитный сегмент.",
          spots: ["Театр Кабуки-дза", "ТЦ Ginza Six", "Улица Chuo-dori (пешеходная по выходным)"]
        },
        {
          name: "Синдзюку (Shinjuku)",
          tag: "Деловой & Ночной мегаполис",
          history: "Бывшая почтовая станция на тракте. После землетрясения 1923 года превратилась в главный высотный деловой центр столицы.",
          atmosphere: "Днем — строгие костюмы и офисы, вечером — неон, бары, уличная еда и развлечения.",
          residents: "Офисные служащие (сарариманы), иностранные студенты, экспаты.",
          architecture: "Лес гигантских небоскребов (включая Мэрию Токио) и узкие исторические переулки Omoide Yokocho.",
          realEstate: "Покупка: ~$12,000–$17,000 / м². Аренда 1К: ~$1,200–$1,700 / мес.",
          spots: ["Смотровая площадка Мэрии", "Парк Shinjuku Gyoen", "Переулок Omoide Yokocho"]
        }
      ],
      shoppingSpots: [
        {
          category: "Традиционные рынки",
          items: [
            { name: "Рынок Амэёко (Ameyoko)", location: "Уэно", desc: "Уличный рынок под ж/д путями. Свежие фрукты, морепродукты, сувениры, доступная одежда.", query: "Ameyoko Shopping Street" },
            { name: "Внешний рынок Цукидзи", location: "Цукидзи", desc: "Гастрономический рынок. Вагю на гриле, свежие морепродукты и клубничные десерты.", query: "Tsukiji Outer Market" }
          ]
        },
        {
          category: "Торговые центры и Моллы",
          items: [
            { name: "Tokyo Solamachi", location: "Ошиаге", desc: "Более 300 магазинов. Pokemon Center, Ghibli Donguri, супермаркет LIFE.", query: "Tokyo Solamachi" },
            { name: "Yodobashi Camera Akiba", location: "Акихабара", desc: "9 этажей электроники, техники, детских игрушек и моделей с Tax-Free.", query: "Yodobashi Camera Akiba" },
            { name: "Shibuya Parco", location: "Сибуя", desc: "Магазин Nintendo Tokyo, Pokemon Center и современные бренды одежды.", query: "Shibuya Parco" }
          ]
        }
      ],
      insiderGuides: [
        { title: "Жизнь в Ошиаге (Sumida)", content: "Супермаркет LIFE в ТЦ Solamachi открыт с 10:00 до 21:00. Скидки до 50% на готовую еду появляются после 19:00. Выход B3 со станции Oshiage оснащен лифтами прямо к улице." },
        { title: "Особенности Tokyo Disneyland", content: "Покупайте билеты заранее через приложение. Внутри доступна аренда детских колясок (1000 иен). Пользуйтесь услугой Rider Switch на аттракционах." }
      ],
      phrases: [
        { ru: "Можно оформить Tax-Free?", jp: "免税できますか？", romaji: "Menzei dekimasu ka?", tag: "Шопинг" },
        { ru: "Где находится лифт?", jp: "エレベーターはどこですか？", romaji: "Erebētā wa doko desu ka?", tag: "Коляска" },
        { ru: "Есть комната матери и ребенка?", jp: "赤ちゃんルームはありますか？", romaji: "Aka-chan rūmu wa arimasu ka?", tag: "Малыш" }
      ]
    };

    function toggleCalc() {
      document.getElementById('calc-modal').classList.toggle('hidden');
    }

    function convertCurrency() {
      const jpy = parseFloat(document.getElementById('jpy-input').value) || 0;
      // Примерный курс 2026: 1 JPY = 3.2 KZT, 1 USD = 150 JPY
      document.getElementById('res-kzt').innerText = Math.round(jpy * 3.2).toLocaleString() + ' KZT';
      document.getElementById('res-usd').innerText = '$' + (jpy / 150).toFixed(1) + ' USD';
    }

    function openMap(query) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
    }

    function switchTab(tabName) {
      const container = document.getElementById("app-content");
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-indigo-400');
        btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if(activeBtn) {
        activeBtn.classList.add('active', 'text-indigo-400');
        activeBtn.classList.remove('text-slate-400');
      }

      if (tabName === 'itinerary') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Подневный план</h2>` +
          TRIP_DATA.dailyItinerary.map(d => `
            <div class="glass-card p-4 rounded-2xl space-y-2 mb-3">
              <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">${d.day} • ${d.date} (${d.badge})</div>
              <div class="text-sm font-bold text-white">${d.title}</div>
              <div class="border-t border-slate-800 pt-2 space-y-2">
                ${d.steps.map(s => `
                  <div class="flex justify-between items-start text-xs text-slate-300 gap-2">
                    <div class="flex gap-2 items-start">
                      <span class="bg-slate-900 text-indigo-400 px-1.5 py-0.5 rounded font-mono text-[10px] border border-slate-800 shrink-0">${s.time}</span>
                      <span>${s.text}</span>
                    </div>
                    ${s.query ? `<button onclick="openMap('${s.query}')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2 py-0.5 rounded border border-slate-700 shrink-0">📍 Карта</button>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
      } else if (tabName === 'districts') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Районы Токио & Недвижимость</h2>` +
          TRIP_DATA.districts.map(dist => `
            <div class="glass-card p-4 rounded-2xl mb-3.5 space-y-2">
              <div class="flex justify-between items-start">
                <div class="text-sm font-bold text-white">${dist.name}</div>
                <span class="text-[9px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">${dist.tag}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">${dist.atmosphere}</p>
              
              <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 space-y-1 text-[11px]">
                <div class="text-indigo-400 font-semibold">🏠 Недвижимость:</div>
                <div class="text-slate-300">${dist.realEstate}</div>
              </div>

              <div class="text-[11px] text-slate-400 space-y-1">
                <div><strong class="text-slate-300">Жители:</strong> ${dist.residents}</div>
                <div><strong class="text-slate-300">История:</strong> ${dist.history}</div>
                <div><strong class="text-slate-300">Архитектура:</strong> ${dist.architecture}</div>
              </div>

              <div class="pt-1 flex flex-wrap gap-1">
                ${dist.spots.map(spot => `<span class="text-[9px] bg-slate-900 text-slate-300 px-2 py-0.5 rounded-md border border-slate-800">📍 ${spot}</span>`).join('')}
              </div>
            </div>
          `).join('');
      } else if (tabName === 'shopping') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Гид по шопингу и рынкам</h2>` +
          TRIP_DATA.shoppingSpots.map(sec => `
            <div class="mb-4">
              <h3 class="text-xs font-bold text-slate-400 uppercase mb-2 pl-1">${sec.category}</h3>
              ${sec.items.map(item => `
                <div class="glass-card p-3.5 rounded-2xl mb-2.5 space-y-1.5">
                  <div class="flex justify-between items-start">
                    <div class="text-sm font-bold text-white">${item.name}</div>
                    <button onclick="openMap('${item.query}')" class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">📍 На карте</button>
                  </div>
                  <div class="text-xs text-slate-300 leading-relaxed">${item.desc}</div>
                </div>
              `).join('')}
            </div>
          `).join('');
      } else if (tabName === 'insider') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Japan Insider</h2>` +
          TRIP_DATA.insiderGuides.map(g => `
            <div class="glass-card p-4 rounded-2xl space-y-1.5 mb-3">
              <div class="text-sm font-bold text-white">${g.title}</div>
              <div class="text-xs text-slate-300 leading-relaxed">${g.content}</div>
            </div>
          `).join('');
      } else if (tabName === 'phrases') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Разговорник</h2>` +
          TRIP_DATA.phrases.map(p => `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center gap-3 mb-3">
              <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">${p.tag} • ${p.ru}</div>
                <div class="text-base font-bold text-white my-0.5">${p.jp}</div>
                <div class="text-xs text-indigo-400">${p.romaji}</div>
              </div>
              <button onclick="speakJP('${p.jp}')" class="bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 w-10 h-10 rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition-transform">
                🔊
              </button>
            </div>
          `).join('');
      }
    }

    function speakJP(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        window.speechSynthesis.speak(u);
      }
    }

    window.onload = function() {
      switchTab('itinerary');
    };
  </script>
</body>
</html>
