        </div>

        🧮 JPY Калькулятор
      </button>
    </header>

    <!-- Всплывающий Калькулятор Иен -->

        <button onclick="toggleCalc()" class="text-xs text-slate-400">✕ Закрыть</button>
      </div>
      <div class="flex gap-2">
        <input id="jpy-input" type="number" placeholder="Сумма в Иенах (¥)" oninput="convertCurrency()" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">

          <div id="res-kzt" class="font-bold text-emerald-400">0 KZT</div>
          <div id="res-usd" class="text-slate-400">0 USD</div>
        </div>
      </div>
    </div>

    <!-- Основное содержимое -->
    <main id="app-content" class="flex-1 p-4 space-y-4"></main>

    <!-- Нижнее Навигационное меню -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-slate-800/80 flex justify-around py-2 px-1 z-50">
      <button onclick="switchTab('itinerary')" id="tab-itinerary" class="nav-btn active flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">

      <button onclick="switchTab('districts')" id="tab-districts" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">

      </button>
      <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-btn flex flex-col items-center py-1.5 px-1.5 text-slate-400 transition-all">
        <span class="text-base">🛍️</span>

    function toggleCalc() {
      document.getElementById('calc-modal').classList.toggle('hidden');
    }

    function convertCurrency() {
      const jpy = parseFloat(document.getElementById('jpy-input').value) || 0;
      document.getElementById('res-kzt').innerText = Math.round(jpy * 3.2).toLocaleString() + ' KZT';
      document.getElementById('res-usd').innerText = '$' + (jpy / 150).toFixed(1) + ' USD';
    }

    // Рабочая функция открытия Google Maps
    function openMap(query) {
      const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
      window.open(url, '_blank');
    }

    function switchTab(tabName) {
      const container = document.getElementById("app-content");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-indigo-400');
        btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if(activeBtn) {
        activeBtn.classList.add('active', 'text-indigo-400');
        activeBtn.classList.remove('text-slate-400');
      }

      if (tabName === 'itinerary') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Подневный план</h2>` +
          TRIP_DATA.dailyItinerary.map(d => `
            <div class="glass-card p-4 rounded-2xl space-y-2 mb-3">
              <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">${d.day} • ${d.date} (${d.badge})</div>
              <div class="text-sm font-bold text-white">${d.title}</div>
              <div class="border-t border-slate-800 pt-2 space-y-2">
                ${d.steps.map(s => `
                  <div class="flex justify-between items-start text-xs text-slate-300 gap-2">
                    <div class="flex gap-2 items-start">
                      <span class="bg-slate-900 text-indigo-400 px-1.5 py-0.5 rounded font-mono text-[10px] border border-slate-800 shrink-0">${s.time}</span>
                      <span>${s.text}</span>
                    </div>
                    ${s.query ? `<button onclick="openMap('${s.query}')" class="text-[10px] bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30 shrink-0">📍 Карта</button>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');

        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Районы Токио (${TRIP_DATA.districts.length})</h2>` +
          TRIP_DATA.districts.map(dist => `
            <div class="glass-card p-4 rounded-2xl mb-3.5 space-y-2">
              <div class="flex justify-between items-start">
                <div class="text-sm font-bold text-white">${dist.name}</div>
                <span class="text-[9px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">${dist.tag}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">${dist.atmosphere}</p>
              
              <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 space-y-1 text-[11px]">
                <div class="text-indigo-400 font-semibold">🏠 Средние цены на недвижимость:</div>

                <div><strong class="text-slate-300">История:</strong> ${dist.history}</div>

          TRIP_DATA.shoppingSpots.map(sec => `
            <div class="mb-4">
              <h3 class="text-xs font-bold text-slate-400 uppercase mb-2 pl-1">${sec.category}</h3>
              ${sec.items.map(item => `
                <div class="glass-card p-3.5 rounded-2xl mb-2.5 space-y-2">
                  <div class="flex justify-between items-start">
                    <div class="text-sm font-bold text-white">${item.name}</div>
                    <button onclick="openMap('${item.query}')" class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">📍 На карте</button>
                  </div>
                  <div class="text-[11px] text-amber-400 font-medium space-y-0.5 bg-amber-500/10 p-2 rounded-xl border border-amber-500/20">
                    <div>${item.schedule}</div>
                    <div>${item.closedDays}</div>
                  </div>
                  <div class="text-xs text-slate-300 leading-relaxed">${item.desc}</div>
                </div>
              `).join('')}
            </div>
          `).join('');
      } else if (tabName === 'insider') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Japan Insider</h2>` +
          TRIP_DATA.insiderGuides.map(g => `
            <div class="glass-card p-4 rounded-2xl space-y-1.5 mb-3">
              <div class="text-sm font-bold text-white">${g.title}</div>
              <div class="text-xs text-slate-300 leading-relaxed">${g.content}</div>
            </div>
          `).join('');
      } else if (tabName === 'phrases') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Разговорник</h2>` +
          TRIP_DATA.phrases.map(p => `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center gap-3 mb-3">
              <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">${p.tag} • ${p.ru}</div>
                <div class="text-base font-bold text-white my-0.5">${p.jp}</div>
                <div class="text-xs text-indigo-400">${p.romaji}</div>
              </div>
              <button onclick="speakJP('${p.jp}')" class="bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 w-10 h-10 rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition-transform">
                🔊
              </button>
            </div>
          `).join('');
      }
    }

    function speakJP(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        window.speechSynthesis.speak(u);
      }
    }

    window.onload = function() {
      switchTab('itinerary');
    };
  </script>
</body>
</html>
