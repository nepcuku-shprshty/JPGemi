<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Family Guide 2026</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 12px;
    }
  </style>
</head>
<body class="h-full flex flex-col max-w-md mx-auto bg-slate-950 font-sans relative pb-24 border-x border-slate-800/60 min-h-screen">

  <header class="sticky top-0 z-50 glass-card px-5 py-4 border-b border-slate-800/80 flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30 text-xs">
        JP
      </div>
      <div>
        <h1 class="font-extrabold text-sm tracking-tight text-white leading-none">Tokyo Family Guide</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">25 Окт — 05 Ноя 2026 • Сумида</p>
      </div>
    </div>
    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      Oshiage
    </span>
  </header>

  <main id="app-content" class="flex-1 p-4 space-y-4"></main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-slate-800/80 flex justify-around py-2 px-1 z-50">
    <button onclick="switchTab('itinerary')" id="tab-itinerary" class="nav-btn active flex flex-col items-center py-1.5 px-3 text-slate-400 transition-all">
      <i data-lucide="calendar" class="w-4 h-4"></i>
      <span class="text-[9px] font-semibold mt-1">Маршрут</span>
    </button>
    <button onclick="switchTab('insider')" id="tab-insider" class="nav-btn flex flex-col items-center py-1.5 px-3 text-slate-400 transition-all">
      <i data-lucide="book-open" class="w-4 h-4"></i>
      <span class="text-[9px] font-semibold mt-1">База знаний</span>
    </button>
    <button onclick="switchTab('phrases')" id="tab-phrases" class="nav-btn flex flex-col items-center py-1.5 px-3 text-slate-400 transition-all">
      <i data-lucide="languages" class="w-4 h-4"></i>
      <span class="text-[9px] font-semibold mt-1">Разговорник</span>
    </button>
  </nav>

  <!-- Подключение файла данных с обходом кэша -->
  <script src="./data.js?v=2026" charset="utf-8"></script>

  <script>
    function switchTab(tabName) {
      const container = document.getElementById("app-content");
      if (!window.TRIP_DATA) return;
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-indigo-400');
        btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if(activeBtn) {
        activeBtn.classList.add('active', 'text-indigo-400');
        activeBtn.classList.remove('text-slate-400');
      }

      if (tabName === 'itinerary') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Подневный план (${TRIP_DATA.dailyItinerary.length} дней)</h2>` +
          TRIP_DATA.dailyItinerary.map(d => `
            <div class="glass-card p-4 rounded-2xl space-y-2 mb-3">
              <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">${d.day} • ${d.date} (${d.badge})</div>
              <div class="text-sm font-bold text-white">${d.title}</div>
              <div class="border-t border-slate-800 pt-2 space-y-2">
                ${d.steps.map(s => `
                  <div class="flex gap-2.5 text-xs text-slate-300 items-start">
                    <span class="bg-slate-900 text-indigo-400 px-1.5 py-0.5 rounded font-mono text-[10px] border border-slate-800 shrink-0">${s.time}</span>
                    <span>${s.text}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
      } else if (tabName === 'insider') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Japan Insider</h2>` +
          TRIP_DATA.insiderGuides.map(g => `
            <div class="glass-card p-4 rounded-2xl space-y-1.5 mb-3">
              <div class="text-sm font-bold text-white">${g.title}</div>
              <div class="text-xs text-slate-300 leading-relaxed">${g.content}</div>
            </div>
          `).join('');
      } else if (tabName === 'phrases') {
        container.innerHTML = `<h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Разговорник</h2>` +
          TRIP_DATA.phrases.map(p => `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center gap-3 mb-3">
              <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">${p.tag} • ${p.ru}</div>
                <div class="text-base font-bold text-white my-0.5">${p.jp}</div>
                <div class="text-xs text-indigo-400">${p.romaji}</div>
              </div>
              <button onclick="speakJP('${p.jp}')" class="bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 w-10 h-10 rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition-transform">
                🔊
              </button>
            </div>
          `).join('');
      }
      
      if (window.lucide) lucide.createIcons();
    }

    function speakJP(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        window.speechSynthesis.speak(u);
      }
    }

    document.addEventListener("DOMContentLoaded", () => switchTab('itinerary'));
  </script>
</body>
</html>
